<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>peerp2p — Local & P2P Messenger</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="guilds-nav" aria-label="App navigation">
        <div class="guild-icon active" aria-label="Messages">💬</div>
        <div class="guild-icon" aria-label="Community">🌿</div>
        <div class="guild-icon" aria-label="Games">🎮</div>
      </aside>

      <aside class="channels-sidebar" aria-label="Peer list sidebar">
        <header class="sidebar-header">
          <h1 class="brand-title">peerp2p</h1>
          <span id="status-badge" class="status-badge online">Local Mode</span>
        </header>

        <div class="user-card">
          <div>
            <div class="label">YOUR ID</div>
            <div id="my-peer-id" class="peer-id-display">Generating...</div>
          </div>
          <button id="btn-copy" class="copy-btn" type="button" title="Copy your peer ID" aria-label="Copy your peer ID">
            📋
          </button>
        </div>

        <div class="section-label">ACTIVE PEERS</div>
        <ul id="peer-list" class="peer-list" aria-live="polite"></ul>
      </aside>

      <main class="chat-viewport" aria-label="Chat panel">
        <header class="chat-header">
          <div>
            <div id="chat-title" class="chat-title">peerp2p-Bot</div>
            <div class="chat-subtitle">Local Peer Bridge</div>
          </div>
        </header>

        <div id="messages-container" class="messages-container" aria-live="polite"></div>

        <form id="chat-form" class="input-area">
          <input
            id="message-input"
            type="text"
            placeholder="Type a message..."
            autocomplete="off"
            aria-label="Message input"
          />
          <button type="submit" class="send-btn">Send</button>
        </form>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
